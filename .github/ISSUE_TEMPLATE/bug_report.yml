name: Bug report / 问题反馈
description: 报告一个清晰化效果或构建上的问题
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      options:
        - macOS
        - iOS
        - Python (CLI / 参考引擎)
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？ / What happened?
      description: 清晰描述现象，最好附上处理前后的 PDF 截图。
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望的结果 / Expected
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
    validations:
      required: false
